<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Ready — Telemedicina 24h</title>
<meta name="description" content="Dr. Ready: médicos nos EUA 24 horas por dia, no seu idioma. Telemedicina em português, inglês e espanhol.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#007c9f; --teal-2:#0a93b9; --deep:#0b3443; --deep-2:#14495c; --ink:#12303b;
  --ice:#f2f8fa; --mist:#e6f3f7; --cta:#d4eff7; --line:#cfe3ea; --red:#ff1a1a; --muted:#4d6670;
  --r-lg:28px; --r-md:20px; --shadow:0 18px 50px -24px rgba(11,52,67,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fff;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg{display:block}
.wrap{width:min(1180px,92vw);margin:0 auto}
section{scroll-margin-top:90px}
h1,h2,h3{font-weight:500;letter-spacing:-.02em;line-height:1.1}
h2{font-size:clamp(2rem,4.2vw,3.3rem)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border-radius:999px;padding:.95em 2em;font:inherit;font-weight:500;font-size:1rem;cursor:pointer;border:2px solid transparent;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-cta{background:var(--cta);color:var(--deep);border-color:var(--deep)}
.btn-cta:hover{background:#c0e8f3}
.btn-dark{background:var(--deep);color:#fff}
.btn-dark:hover{background:var(--deep-2)}
.btn-ghost{border-color:#fff;color:#fff;background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-white{background:#fff;color:var(--deep)}
.dot{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--red);vertical-align:.08em;margin-left:.08em}

/* top bar */
.topbar{background:var(--deep);color:#dbeef4;font-size:.85rem}
.topbar .wrap{display:flex;align-items:center;justify-content:center;gap:1.2rem;padding:.55rem 0;flex-wrap:wrap}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:.5em;background:#fff;color:var(--deep);border:0;border-radius:999px;padding:.4em 1em;font:inherit;font-weight:500;cursor:pointer}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:170px;display:none;z-index:60}
.lang-menu.open{display:block}
.lang-menu button{display:flex;gap:.6em;align-items:center;width:100%;padding:.7em 1em;border:0;background:#fff;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.lang-menu button:hover,.lang-menu button[aria-current="true"]{background:var(--mist)}
.flag{width:22px;height:15px;border-radius:3px;overflow:hidden;flex:none}

/* nav */
header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #eef3f5}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.logo{color:var(--teal);width:150px}
.nav ul{display:flex;gap:1.6rem;list-style:none;font-size:.98rem}
.nav ul a{position:relative;padding:.3em 0}
.nav ul a:hover{color:var(--teal)}
.nav ul a.login{color:var(--teal);font-weight:600}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;color:var(--deep)}
@media (max-width:1100px){
  .nav ul{position:fixed;inset:78px 0 auto 0;background:#fff;flex-direction:column;gap:0;padding:.5rem 4vw 1.2rem;box-shadow:var(--shadow);display:none}
  .nav ul.open{display:flex}
  .nav ul a{display:block;padding:.85em 0;border-bottom:1px solid #eef3f5}
  .burger{display:block}
}

/* hero */
.hero{position:relative;min-height:640px;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:
  radial-gradient(900px 500px at 85% 20%,rgba(10,147,185,.55),transparent 60%),
  radial-gradient(700px 500px at 10% 100%,rgba(0,124,159,.5),transparent 60%),
  linear-gradient(135deg,#0b3443 0%,#0d4558 55%,#0a5a72 100%)}
.hero .art{position:absolute;right:4vw;top:60px;width:min(430px,38vw)}
.hero .wrap{position:relative;padding:110px 0 80px}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.6rem);max-width:15ch;margin-bottom:1.4rem}
.hero p{font-size:clamp(1.05rem,1.6vw,1.35rem);max-width:60ch;opacity:.92;margin-bottom:2rem}
.hero .ctas{display:flex;gap:1rem;flex-wrap:wrap}
.phone{background:#0e2a35;border-radius:38px;padding:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12)}
.phone .screen{background:linear-gradient(160deg,#1a5f75,#0b3443);border-radius:28px;aspect-ratio:9/16;position:relative;overflow:hidden;padding:22px}
.doc-avatar{width:100%;aspect-ratio:1;border-radius:22px;background:linear-gradient(180deg,#d6eef5,#9fd3e3);display:grid;place-items:center}
.pip{position:absolute;right:22px;top:46%;width:34%;aspect-ratio:3/4;border-radius:16px;background:linear-gradient(180deg,#f3e7dd,#e2c9b4);border:3px solid #0e2a35;display:grid;place-items:center}
.call-bar{position:absolute;left:22px;right:22px;bottom:22px;display:flex;justify-content:center;gap:14px}
.call-bar span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.call-bar span.end{background:var(--red)}
.live{position:absolute;left:22px;top:22px;margin:10px;background:rgba(11,52,67,.75);color:#fff;font-size:.75rem;padding:.3em .8em;border-radius:99px;display:flex;align-items:center;gap:.4em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red)}
@media (max-width:860px){.hero .art{display:none}.hero{min-height:560px}}

/* about */
.about{background:var(--ice);padding:110px 0}
.grid-2{display:grid;grid-template-columns:1.05fr 1fr;gap:4rem;align-items:center}
.grid-2>*{min-width:0}
@media (max-width:600px){.btn{white-space:normal;text-align:center}}
@media (max-width:900px){.grid-2{grid-template-columns:1fr;gap:2.5rem}}
.about h2{margin-bottom:1.5rem;color:var(--deep)}
.about p{font-size:1.12rem;margin-bottom:1.1rem;color:#24414c}
.chips-card{background:var(--deep);border-radius:var(--r-lg);padding:44px 0 40px;overflow:hidden;position:relative}
.avatars{display:flex;gap:22px;padding:0 44px;margin-bottom:28px}
.avatars>div{width:120px;aspect-ratio:1;border-radius:18px;display:grid;place-items:center}
.search-pill{margin:0 44px 22px;border:2px solid rgba(255,255,255,.35);border-radius:999px;color:#fff;padding:.8em .8em .8em 1.6em;display:flex;align-items:center;justify-content:space-between;font-size:1.15rem}
.search-pill b{width:42px;height:42px;border-radius:50%;background:var(--cta);display:grid;place-items:center;flex:none}
.chip{background:var(--cta);color:var(--deep);border-radius:999px;font-size:clamp(1.05rem,1.9vw,1.6rem);font-weight:500;padding:.6em 1.2em;margin:0 0 16px;text-align:center;white-space:nowrap}
.chip:nth-of-type(1){margin-left:24px;margin-right:24px}
.chip:nth-of-type(2){margin-left:-10px;margin-right:60px}
.chip:nth-of-type(3){margin-left:60px;margin-right:-10px}
.checks{background:#fff;border-radius:var(--r-lg);margin-top:80px;padding:56px 70px;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
@media (max-width:900px){.checks{grid-template-columns:1fr;padding:36px 26px}}
.checks ul{list-style:none}
.checks li{display:flex;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1.5px solid var(--deep);font-size:1.3rem}
.checks li:last-child{border:0}
.badge{width:30px;height:30px;flex:none}
.border-card{background:linear-gradient(150deg,#0e4a5e,#0b3443);border-radius:var(--r-md);color:#fff;padding:44px;position:relative}
.border-card h3{font-style:italic;font-size:clamp(1.8rem,3vw,2.6rem);margin-bottom:1rem}
.about .border-card p{color:#d3e9f0;opacity:1}
.border-card .mini{width:110px;height:30px;color:#fff;margin-bottom:1.4rem}

/* services */
.services{padding:120px 0;text-align:center}
.services h2{margin-bottom:1.6rem}
.services .lead{font-size:1.2rem;max-width:62ch;margin:0 auto 4rem}
.cards-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem;text-align:left;margin-bottom:3.5rem}
@media (max-width:1000px){.cards-4{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.cards-4{grid-template-columns:1fr}}
.svc{background:var(--ice);border-radius:var(--r-md);padding:34px 32px 40px}
.svc .ic{width:62px;height:62px;border-radius:50%;background:var(--deep);display:grid;place-items:center;margin-bottom:2.2rem;color:#9fe0f1}
.svc h3{font-size:1.65rem;margin-bottom:1rem}
.svc p{font-size:1.05rem;color:#2c4752;margin-bottom:.8rem}

/* steps */
.steps-sec{border-top:14px solid var(--deep);padding:110px 0 90px}
.steps-sec h2{text-align:center;max-width:22ch;margin:0 auto 4rem;color:var(--deep)}
.steps{list-style:none;position:relative;margin-bottom:2.5rem}
.steps li{display:flex;gap:1.2rem;padding-bottom:2.2rem;position:relative;font-size:1.15rem}
.steps li::before{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:#d5e1e5}
.steps li:last-child::before{bottom:-30px}
.steps .n{width:36px;height:36px;border-radius:50%;border:2px solid #c7d6db;display:grid;place-items:center;flex:none;background:#fff;font-weight:600;position:relative;z-index:1}
.steps li:first-child .n{background:var(--deep);color:#fff;border-color:var(--deep)}
.steps-note{font-size:.98rem;color:#2c4752;margin-bottom:2rem}
.pills-box{background:#f3fafc;border-radius:6px;aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden}
.pills-box::before,.pills-box::after{content:"";position:absolute;border-radius:50%;border:2px solid #cfe9f1}
.pills-box::before{width:92%;height:92%}.pills-box::after{width:68%;height:68%}
.pills{position:relative;z-index:1;display:flex;flex-direction:column;gap:1.4rem;width:76%}
.pill{background:#fff;border-radius:999px;box-shadow:0 14px 30px -14px rgba(11,52,67,.3);padding:.9em 1.4em;font-size:clamp(1.2rem,2.2vw,2rem);font-weight:600;color:var(--deep);display:flex;align-items:center;justify-content:center;gap:.6em}
.pill svg{width:1.1em;height:1.1em}

/* in-person */
.inperson{background:#f7fafb;border:1px solid #e3edf0;border-radius:var(--r-lg);padding:60px 70px;margin-top:80px;display:grid;grid-template-columns:1.15fr 1fr;gap:3rem}
@media (max-width:950px){.inperson{grid-template-columns:1fr;padding:36px 24px}}
.steps-sec .inperson h2{text-align:left;margin:0 0 1.4rem;max-width:none}
.inperson h2 em{font-style:normal;color:var(--teal)}
.inperson p{font-size:1.15rem;color:#4b6670;margin-bottom:2rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.stat{border:1px solid #dbe7eb;border-radius:var(--r-md);padding:26px;background:#fff}
.stat.dark{background:var(--deep);color:#fff;border-color:var(--deep)}
.stat b{font-size:2.6rem;font-weight:600;line-height:1;display:block;margin-bottom:.6rem}
.stat.dark b{color:#8fdcf0}
.stat b small{font-size:1.1rem;font-weight:500;margin-left:.25em}
.stat span{font-size:.98rem;color:#62808a}
.stat.dark span{color:#d4e9ef}
.partner{display:flex;gap:2rem;align-items:center;flex-wrap:wrap;font-size:.95rem;border-top:1px solid #e3edf0;padding-top:1.6rem}
.partner small{display:block;font-size:.72rem;letter-spacing:.12em;color:#62808a}
.partner b{font-size:1.35rem;letter-spacing:.06em;color:var(--deep)}

/* profiles */
.profiles{padding:110px 0 0}
.profiles .head{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;margin-bottom:3.5rem;align-items:start}
.profiles .head p{text-align:right;font-size:1.2rem}
@media (max-width:900px){.profiles .head{grid-template-columns:1fr}.profiles .head p{text-align:left}}
.prof-band{background:var(--ice);padding:40px 0 70px;text-align:center}
.prof-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:1.4rem;margin-bottom:3rem;text-align:left}
@media (max-width:900px){.prof-grid{grid-template-columns:1fr}}
.prof{border-radius:var(--r-md);min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding:34px;position:relative;overflow:hidden}
.prof h3{font-size:2rem;margin-bottom:.4rem}
.prof p{opacity:.92;font-size:1.05rem;max-width:40ch}
.prof .illus{position:absolute;inset:0;opacity:.95}
.prof>*:not(.illus){position:relative}
.prof.p1{background:linear-gradient(170deg,#3a8ea6,#0b3443 85%)}
.prof.p2{background:linear-gradient(170deg,#5aa9bd,#123f50 85%)}
.prof.p3{background:linear-gradient(170deg,#2a6b80,#071f29 85%)}

/* plans */
.plans{background:linear-gradient(180deg,#0b3443,#2b5a6b);color:#fff;padding:110px 0}
.plans h2{text-align:center;margin-bottom:4rem}
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;align-items:start}
@media (max-width:1100px){.plan-grid{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.plan-grid{grid-template-columns:1fr}}
.plan{border:3px solid rgba(255,255,255,.18);background:rgba(11,52,67,.6);border-radius:var(--r-lg);padding:38px 30px;display:flex;flex-direction:column;height:100%}
.plan.biz{background:var(--cta);color:var(--deep);border-color:var(--cta)}
.plan .pi{width:46px;height:46px;margin-bottom:2rem}
.plan h3{font-size:2rem;margin-bottom:1.2rem}
.plan .price{font-size:2.4rem;font-weight:500;margin-bottom:1.5rem}
.plan .price small{font-size:1rem;opacity:.75}
.plan ul{list-style:none;flex:1;margin-bottom:2rem}
.plan li{display:flex;gap:.9rem;padding:.5rem 0;font-size:1.02rem;line-height:1.3}
.plan li::before{content:"↗";font-weight:700;flex:none;font-size:1.1rem}
.plan{min-width:0}.plan .btn{width:100%;white-space:normal;text-align:center}

/* specialties */
.spec{padding:110px 0}
.spec h2{margin-bottom:1rem}
.spec .lead{font-size:1.15rem;color:var(--muted);margin-bottom:3rem;max-width:60ch}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.sp{border:1px solid var(--line);border-radius:var(--r-md);padding:22px 24px;display:flex;align-items:center;gap:1rem;font-size:1.1rem;font-weight:500;background:#fff;transition:border-color .2s}
.sp:hover{border-color:var(--teal)}
.sp i{width:42px;height:42px;border-radius:50%;background:var(--mist);color:var(--teal);display:grid;place-items:center;flex:none;font-style:normal;font-weight:700}
.sp.gp{background:var(--deep);color:#fff;border-color:var(--deep)}
.sp.gp i{background:var(--teal);color:#fff}

/* patient */
.patient{padding:100px 0;background:var(--ice)}
.patient h2{font-weight:700;color:var(--deep);margin-bottom:1.4rem;font-size:clamp(2rem,3.4vw,2.8rem)}
.patient p{font-size:1.2rem;color:#2c4752;margin-bottom:2rem}
.patient ul{list-style:none;margin-bottom:2.4rem}
.patient li{display:flex;gap:1.1rem;align-items:flex-start;padding:.45rem 0;font-size:1.15rem}
.patient li svg{width:26px;height:26px;flex:none;margin-top:2px}
.patient .btns{display:flex;flex-direction:column;align-items:flex-start;gap:1.2rem}
.win{background:var(--deep);border-radius:16px;padding:14px}
.win .bar{display:flex;gap:6px;margin-bottom:10px}
.win .bar i{width:10px;height:10px;border-radius:50%}
.win .vid{border-radius:8px;aspect-ratio:16/9;background:linear-gradient(160deg,#e3f2f6,#a9d7e5);position:relative;display:grid;place-items:center;overflow:hidden}
.win .vid .pip{top:auto;bottom:14px;right:14px;width:22%;aspect-ratio:3/4;border-width:2px}

/* faq */
.faq{background:linear-gradient(180deg,#0b3443,#3e6578);color:#fff;padding:100px 0}
.faq h2{margin-bottom:3rem}
.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 5rem}
@media (max-width:900px){.faq-grid{grid-template-columns:1fr}}
details{border-bottom:1.5px dashed rgba(255,255,255,.35)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:1.5rem;padding:1.3rem 0;font-size:1.18rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";transition:transform .2s;flex:none}
details[open] summary::after{transform:rotate(180deg)}
details p{padding:0 0 1.4rem;color:#d6e8ee;font-size:1.04rem}

/* help */
.help{padding:90px 0 40px;position:relative}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media (max-width:800px){.help-grid{grid-template-columns:1fr}}
.help-card{background:#f5f9fa;border-radius:var(--r-lg);padding:56px 40px}
.help-card h3{font-size:2rem;margin-bottom:.8rem}
.help-card p{font-size:1.15rem;margin-bottom:1.8rem;color:#24414c}
.help .glow{height:90px;margin-top:-30px;background:radial-gradient(60% 100% at 40% 0%,rgba(0,124,159,.18),transparent 70%)}

/* app */
.app{padding:60px 0 20px}
.app-card{background:linear-gradient(120deg,var(--teal),#0b5d78);color:#fff;border-radius:var(--r-lg);padding:56px;display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap}
.app-card h2{font-size:clamp(1.8rem,3vw,2.6rem);margin-bottom:.6rem}
.app-card p{opacity:.9;font-size:1.1rem;max-width:46ch}
.stores{display:flex;gap:1rem;flex-wrap:wrap}
.store{display:flex;align-items:center;gap:.7rem;background:#071f29;color:#fff;border-radius:14px;padding:.75em 1.3em;min-width:190px}
.store small{display:block;font-size:.72rem;opacity:.75;line-height:1}
.store b{font-size:1.15rem;font-weight:600;line-height:1.2}

/* work */
.work{padding:100px 0 120px}
.work h2{font-size:clamp(2.4rem,4.6vw,3.8rem);margin-bottom:1.2rem}
.work .lead{font-size:1.25rem;color:#2c4752;margin-bottom:3rem}
form.card{background:#f5f9fa;border:1.5px solid #d6e9ee;border-radius:var(--r-lg);padding:56px 64px;display:grid;grid-template-columns:1fr 1fr;gap:1.6rem 1.8rem}
@media (max-width:760px){form.card{grid-template-columns:1fr;padding:32px 22px}}
.field{display:flex;flex-direction:column;gap:.6rem}
.field.full{grid-column:1/-1}
.field label{font-weight:700;color:var(--deep)}
.field label .req{color:var(--red);margin-left:.3em}
.field input,.field select,.field textarea{font:inherit;font-size:1.05rem;border:1.5px solid #cfdfe4;border-radius:12px;padding:1em 1.1em;background:#fff;color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.field textarea{min-height:170px;resize:vertical}
.consent{grid-column:1/-1;display:flex;gap:.7rem;align-items:center;font-weight:600;color:var(--deep)}
.consent input{width:20px;height:20px;accent-color:var(--teal)}
.form-msg{grid-column:1/-1;border-radius:12px;padding:1em 1.2em;display:none;font-weight:500}
.form-msg.ok{display:block;background:#e3f6ec;color:#155d3a}
.form-msg.err{display:block;background:#fde8e8;color:#8c1d1d}

/* footer */
footer{background:radial-gradient(800px 300px at 90% 100%,rgba(0,124,159,.45),transparent 70%),radial-gradient(600px 300px at 0% 100%,rgba(70,120,150,.4),transparent 70%),#0f3a4a;color:#fff;padding:90px 0 50px}
.foot{display:flex;justify-content:space-between;gap:3rem;flex-wrap:wrap}
.foot .logo{width:220px;color:#fff;margin-bottom:2rem}
.contact li{display:flex;gap:.9rem;align-items:center;font-size:1.15rem;margin-bottom:1rem;list-style:none}
.contact svg{width:26px;height:26px;color:#8fdcf0;flex:none}
.socials{display:flex;gap:.6rem;margin-top:2.4rem}
.socials a{width:58px;height:58px;border-radius:6px;display:grid;place-items:center}
.socials svg{width:30px;height:30px}
.foot nav ul{list-style:none}
.foot nav a{display:block;font-size:1.15rem;padding:.5rem 0;opacity:.95}
.foot nav a:hover{color:#8fdcf0}
.legal{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:4rem;font-size:1rem;opacity:.9}

let lang = "pt";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function linkFor(key){ return CONFIG.links[key] || "#"; }

function render(){
  const d = T[lang];
  document.documentElement.lang = d._html;
  document.querySelectorAll("[data-i]").forEach(el => { const v = d[el.dataset.i]; if (v !== undefined) el.innerHTML = v; });
  $("#curLang").textContent = d._name;
  $("#curFlag").innerHTML = FLAGS[lang];
  $("#langMenu").innerHTML = Object.keys(T).map(k =>
    `<button role="menuitem" data-lang="${k}" aria-current="${k===lang}"><span class="flag">${FLAGS[k]}</span>${T[k]._name}</button>`).join("");

  $("#checkList").innerHTML = d.checks.map(c => `<li><svg class="badge"><use href="#seal"/></svg>${esc(c)}</li>`).join("");

  $("#planGrid").innerHTML = d.plans.map(p => {
    const href = CONFIG.planLinks[p.id] || (p.id === "business" ? linkFor("whatsapp") : linkFor("subscribe"));
    const isBiz = p.id === "business";
    return `<div class="plan${isBiz ? " biz" : ""}">
      <svg class="pi"><use href="#${p.icon}"/></svg>
      <h3>${esc(p.name)}</h3>
      ${p.price ? `<div class="price">${p.price}<small>${d.per_month}</small></div>` : ""}
      <ul>${p.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
      <a class="btn ${isBiz ? "btn-dark" : "btn-white"}" href="${esc(href)}" target="_blank" rel="noopener">${esc(p.btn)}</a>
    </div>`;
  }).join("");

  $("#specGrid").innerHTML = d.specs.map((s, i) =>
    `<div class="sp${i===0 ? " gp" : ""}"><i>${i===0 ? "24h" : esc(s.trim()[0])}</i>${esc(s)}</div>`).join("");

  $("#paList").innerHTML = d.pa_items.map(i => `<li><svg><use href="#check"/></svg>${esc(i)}</li>`).join("");

  const half = Math.ceil(d.faq.length / 2);
  const faqHtml = arr => arr.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  $("#faqA").innerHTML = faqHtml(d.faq.slice(0, half));
  $("#faqB").innerHTML = faqHtml(d.faq.slice(half));

  $("#ro").innerHTML = d.roles.map((r, i) => `<option value="${i===0 ? "" : esc(r)}">${esc(r)}</option>`).join("");

  document.querySelectorAll("[data-link]").forEach(a => {
    a.href = linkFor(a.dataset.link);
    if (/^https?:/.test(a.href) && !a.href.startsWith(location.origin + location.pathname)) { a.target = "_blank"; a.rel = "noopener"; }
  });
  $("#phoneTxt").textContent = CONFIG.phone;
  $("#emailTxt").textContent = CONFIG.email;
  $("#emailTxt").href = "mailto:" + CONFIG.email;
  $("#addrTxt").textContent = CONFIG.address;
  $("#yr").textContent = "© " + new Date().getFullYear();
  $("#formMsg").className = "form-msg";
}

function setLang(l){
  if (!T[l]) return;
  lang = l;
  try { localStorage.setItem("drready_lang", l); } catch(e) {}
  render();
}

(function init(){
  let saved = null;
  try { saved = localStorage.getItem("drready_lang"); } catch(e) {}
  const nav = (navigator.language || "pt").slice(0,2).toLowerCase();
  lang = T[saved] ? saved : (T[nav] ? nav : "pt");
  render();
})();

/* menu de idiomas */
const langBtn = $("#langBtn"), langMenu = $("#langMenu");
langBtn.addEventListener("click", e => { e.stopPropagation(); const o = langMenu.classList.toggle("open"); langBtn.setAttribute("aria-expanded", o); });
langMenu.addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) { setLang(b.dataset.lang); langMenu.classList.remove("open"); } });
document.addEventListener("click", () => langMenu.classList.remove("open"));

/* menu mobile */
$("#burger").addEventListener("click", () => $("#menu").classList.toggle("open"));
$("#menu").addEventListener("click", e => { if (e.target.closest("a")) $("#menu").classList.remove("open"); });

/* formulário Trabalhe conosco */
$("#workForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, msg = $("#formMsg"), d = T[lang];
  const ok = [...f.querySelectorAll("[required]")].every(el => el.type === "checkbox" ? el.checked : el.value.trim() && el.checkValidity());
  if (!ok) { msg.className = "form-msg err"; msg.textContent = d.f_err; return; }
  const data = Object.fromEntries(new FormData(f).entries());
  data.language = lang; data.source = "drready-site";
  if (CONFIG.formEndpoint) {
    try {
      const r = await fetch(CONFIG.formEndpoint, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data) });
      if (!r.ok) throw new Error(r.status);
    } catch(err) { msg.className = "form-msg err"; msg.textContent = d.f_fail; return; }
  }
  msg.className = "form-msg ok"; msg.textContent = d.f_ok; f.reset();
});
</script>
</body>
</html>
